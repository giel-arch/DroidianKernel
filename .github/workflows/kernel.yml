name: kernel

on:
  push:
    branches: [droidian]
    paths:
      - "debian/**"
      - "droidian/**"
      - ".github/workflows/kernel.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_REPO: https://github.com/oppo-source/android_kernel_oppo_mt6769
  KERNEL_BRANCH: oppo/mt6769_u_14.0_a38_a18
  MODS_REPO: https://github.com/oppo-source/android_kernel_modules_oppo_mt6769
  MODS_BRANCH: oppo/mt6769_u_14.0_a38_a18

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel-src
          git clone --depth=1 -b "$MODS_BRANCH" "$MODS_REPO" modules-src
          du -sh kernel-src modules-src

      - name: Apply kernel patches
        run: |
          cd kernel-src
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/kernel-patches/*.patch; do
            echo "applying $(basename $p)"
            patch -p1 < "$p"
          done

      - name: Apply Droidian packaging + oplus vendor overlay
        run: |
          # 60 symlinks inside the kernel tree (kernel/sched_assist,
          # drivers/soc/oplus/*, ...) point to ../../vendor/oplus/... - i.e.
          # a vendor/ dir NEXT TO the kernel tree. That content is proprietary
          # and only published in the kernel_modules repo: overlay it at the
          # parent level. /buildd/sources = kernel-src, so the container also
          # mounts the overlay at /buildd/vendor.
          mkdir -p vendor-overlay
          cp -a modules-src/vendor vendor-overlay/
          cp -a debian kernel-src/debian
          cp -a droidian kernel-src/droidian
          cp droidian/droidian_cph2579_defconfig kernel-src/arch/arm64/configs/
          # MTK/oplus Makefiles force -Werror for their pinned clang; modern
          # clang emits more diagnostics (e.g. -Wvoid-pointer-to-int-cast in
          # cmdq). Strip BARE -Werror only (keep -Werror=foo / -Werror-foo).
          find kernel-src -name Makefile -o -name '*.mak' | xargs sed -i -E 's/(^|[ =])-Werror([[:space:]]|$)/\1\2/g' || true
          find vendor-overlay -name Makefile | xargs sed -i -E 's/(^|[ =])-Werror([[:space:]]|$)/\1\2/g' || true
          # oplus headers reach back into the kernel tree via the AOSP dir
          # name ('../../../../kernel-4.19/drivers/...') - replicate Oppo's
          # real layout where the kernel tree dir is named kernel-4.19.
          ln -sfn . kernel-src/kernel-4.19
          mkdir -p packages

      - name: Build kernel packages (quay.io/droidian/build-essential)
        run: |
          docker pull quay.io/droidian/build-essential:next-amd64
          docker run --rm \
            -v "$PWD/kernel-src:/buildd/sources" \
            -v "$PWD/packages:/buildd" \
            -v "$PWD/vendor-overlay/vendor:/buildd/vendor" \
            quay.io/droidian/build-essential:next-amd64 \
            bash -c 'set -e; apt-get update -qq; apt-get install -y -qq linux-packaging-snippets >/dev/null; cd /buildd/sources; rm -f debian/control; debian/rules debian/control; RELENG_HOST_ARCH=arm64 releng-build-package'

      - name: Build debug boot image (break=premount + telnet)
        run: |
          # Bring-up aid: same boot image but pausing the halium initramfs at
          # the 'premount' stage with telnetd on 192.168.2.15 (usb RNDIS), so
          # early-boot hangs can be inspected from a PC. NOT for daily use.
          docker run --rm -v "$PWD/kernel-src:/buildd/sources" \
            quay.io/droidian/build-essential:next-amd64 bash -c 'set -e; K=/buildd/sources/out/KERNEL_OBJ; mkbootimg --header_version 2 --kernel $K/arch/arm64/boot/Image.default --dtb $K/dtb-merged --dtb_offset 0x0bc80000 --ramdisk $K/initramfs.gz --pagesize 2048 --base 0x40000000 --kernel_offset 0x00080000 --ramdisk_offset 0x07c80000 --second_offset 0x00000000 --tags_offset 0x0bc80000 --os_version 12.0.0 --os_patch_level 2024-12 --cmdline "bootopt=64S3,32N2,64N2 buildvariant=user androidboot.selinux=permissive loop.max_part=7 console=tty0 ignore_loglevel mtk_printk_ctrl.disable_uart=0 printk.force_uart=1 droidian.lvm.prefer break=premount" -o $K/boot-debug.img && ls -la $K/boot-debug.img'

      - name: Collect boot images
        run: |
          mkdir -p images
          find kernel-src/out/KERNEL_OBJ -maxdepth 1 -name '*.img' -size +1k -exec cp -v {} images/ \; || true
          echo "=== packages ==="; ls -la packages || true
          echo "=== images ==="; ls -la images || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-debs
          path: |
            packages/*.deb
            images/*.img
          if-no-files-found: error

      - name: Publish to apt repository (gh-pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-apt.sh "$PWD/packages"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-kernel"
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" packages/*.deb images/*.img \
            -t "Droidian kernel build $(date -u +%Y%m%d%H%M)" \
            --notes "Oppo A38 (cph2579) kernel for Droidian (Halium 14). Flash: fastboot flash boot boot.img (both slots), fastboot flash vbmeta vbmeta.img --disable-verity --disable-verification." \
            --prerelease
